services:
  # ── Base de Datos PostgreSQL ───────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: azomalli_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-azomalli}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-azomalli}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend API (Flask) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: azomalli_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-azomalli}
      SECRET_KEY: ${SECRET_KEY:-dev_azomalli_super_secret_key_123}
      FLASK_APP: run.py
      FLASK_DEBUG: 1
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/__pycache__

  # ── Frontend SPA (React) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: azomalli_frontend
    restart: always
    depends_on:
      - backend
    environment:
      REACT_APP_API_BASE_URL: http://localhost:5000
      PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true

volumes:
  postgres_data:
